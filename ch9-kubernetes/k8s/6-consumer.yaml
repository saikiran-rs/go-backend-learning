apiVersion: v1
kind: ConfigMap
metadata:
  name: consumer-config
  namespace: wiki
data:
  REDPANDA_BROKERS: "redpanda:9092"
  WIKI_TOPIC: "wiki-events-proto"
  CONSUMER_GROUP: "wiki-stats"
  SCYLLA_HOST: "scylla"
  SCYLLA_PORT: "9042"
  NUM_CONSUMERS: "3"
  BATCH_SIZE: "100"
  BATCH_TIMEOUT: "5s"
  METRICS_ADDR: ":2112"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      initContainers:
        - name: wait-scylla
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z scylla 9042; do echo waiting for scylla; sleep 2; done"]
      containers:
        - name: consumer
          image: wiki-consumer:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: consumer-config
          ports:
            - name: metrics
              containerPort: 2112
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: wiki
spec:
  selector:
    app: consumer
  ports:
    - name: metrics
      port: 2112
      targetPort: 2112
