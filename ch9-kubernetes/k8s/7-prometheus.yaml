apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: wiki
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: producer
        static_configs:
          - targets: ['producer:2112']
      - job_name: consumer
        static_configs:
          - targets: ['consumer:2112']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: wiki
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
