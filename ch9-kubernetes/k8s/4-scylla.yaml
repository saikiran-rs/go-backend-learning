apiVersion: v1
kind: Service
metadata:
  name: scylla
  namespace: wiki
spec:
  clusterIP: None
  selector:
    app: scylla
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scylla
  namespace: wiki
spec:
  serviceName: scylla
  replicas: 1
  selector:
    matchLabels:
      app: scylla
  template:
    metadata:
      labels:
        app: scylla
    spec:
      containers:
        - name: scylla
          image: scylladb/scylla:latest
          args:
            - --smp
            - "1"
            - --overprovisioned
            - "1"
            - --developer-mode
            - "1"
            - --memory
            - 1G
          ports:
            - name: cql
              containerPort: 9042
          volumeMounts:
            - name: data
              mountPath: /var/lib/scylla
          readinessProbe:
            exec:
              command: ["sh", "-c", "cqlsh -e 'describe cluster'"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 20
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi
